<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Obby 3D</title></head>
<body>
<script type="module">
// 3D parkour: WASD / arrows + Space, a joystick on phones. Forward is -z.
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js';
window.THREE = THREE;
await import('../src/upbilim-engine.js');

UB.create3d({ sky: '#8fd3ff' });
UB.scene('play', {
  enter(s) {
    UB.clear3d(); s.score = 0;
    s.hero = UB.spawn({ shape: 'box', w: 1, h: 2, d: 1, y: 1, color: '#ff6b6b' });
    s.pc = UB.player3d(s.hero, { speed: 7, jump: 10 });
    UB.camera3d({ mode: 'follow', target: s.hero, distance: 10, height: 5 });
    s.coins = []; s.movers = [];
    for (let i = 1; i <= 12; i++) {
      const p = UB.spawn({ shape: 'box', w: 3, h: 0.5, d: 3, x: (i % 3 - 1) * 2, y: i * 0.7, z: -i * 4.5, color: i % 4 === 0 ? '#ffb703' : '#8ecae6', solid: true });
      if (i % 4 === 0) s.movers.push({ e: p, x0: p.x });
      s.coins.push(UB.prefab('coin', { x: p.x, y: p.y + 1.3, z: p.z }));
    }
    s.finish = UB.prefab('flag', { x: 0, y: 13 * 0.7 + 1.5, z: -13 * 4.5 });
    UB.spawn({ shape: 'box', w: 4, h: 0.5, d: 4, x: 0, y: 13 * 0.7, z: -13 * 4.5, color: '#06d6a0', glow: '#0a5', solid: true });
    for (let i = 0; i < 30; i++) UB.prefab(UB.pick(['tree', 'pine', 'rock', 'cloud']), { x: UB.pick([-1, 1]) * UB.rand(12, 40), z: -UB.rand(0, 70) });
  },
  update(s) {
    for (const m of s.movers) m.e.x = m.x0 + Math.sin(UB.time * 1.5) * 3;
    for (const c of s.coins) if (c.visible && UB.dist3d(s.hero, c) < 1.4) { c.visible = false; s.score++; UB.sfx('coin'); UB.burst3d(c.x, c.y, c.z); }
    for (const c of s.coins) c.rotY += 0.05;
    if (UB.dist3d(s.hero, s.finish) < 2.5) { UB.sfx('win'); UB.go('play'); }
    if (s.hero.y < -10) { s.hero.x = 0; s.hero.y = 1; s.hero.z = 0; s.hero.vy = 0; }
  },
  draw(g, s) { UB.hud.score(s.score, { label: 'Coins' }); },
});
UB.start('play');
</script>
</body></html>
